name: ci

on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test tests/*.test.js

  contract:
    name: API contract compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compare the candidate contract with the published one
        run: node .github/contract-check.mjs

  dependencies:
    name: dependency impact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: report consumers that read a field this release removes
        run: node .github/dependency-check.mjs
